name: Build und Tests

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1

jobs:
  aufraeumen:
    # Alte Build-Zwischenstände löschen (die fertigen Dateien liegen dauerhaft in den Releases),
    # damit das Speicherkontingent für Artefakte nicht voll läuft.
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Alte Artefakte löschen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.workflow_run.id != '"${GITHUB_RUN_ID}"') | .id' | while read id; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" && echo "gelöscht: $id"
          done

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Godot laden
        run: |
          curl -sSL -o g.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q g.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot
      - name: Import
        run: ./godot --headless --path . --import || true
      - name: Kerntests
        run: ./godot --headless --path . res://tests/run_tests.tscn
      - name: Mehrspielertest (Host + 2 Clients)
        run: tools/test_multiplayer.sh ./godot
      - name: Mehrspielertest über Vermittlungsdienst
        run: tools/test_relay.sh ./godot

  wyse:
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Godot und Linux-Exportvorlagen laden
        run: |
          curl -sSL -o g.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q g.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot
          curl -sSL -o t.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q -j t.tpz templates/linux_release.x86_64 templates/linux_debug.x86_64 templates/version.txt -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Linux-Export für den Vermittlungsdienst
        run: |
          ./godot --headless --path . --import || true
          mkdir -p wyse
          ./godot --headless --path . --export-release "Linux" wyse/leitstelle112.x86_64
          cp tools/wyse/* docs/VERMITTLUNGSDIENST.md docs/SERVER_INSTALLATION.md wyse/
          test -s wyse/leitstelle112.x86_64
          echo "APP_VERSION=$(grep -oP '^config/version="\K[^"]+' project.godot)" >> $GITHUB_ENV
      - name: Start des Vermittlungsdienstes prüfen
        run: |
          (timeout 8 wyse/leitstelle112.x86_64 --headless -- --vermittlung --port=24180 || true) | tee relay.log
          grep -q "Vermittlungsdienst LEITSTELLE 112 gestartet" relay.log
      - name: Paket für den Vermittlungsdienst zum Release hinzufügen
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x wyse/leitstelle112.x86_64 wyse/*.sh
          tar -czf LEITSTELLE112-Wyse-Vermittlung-${APP_VERSION}.tar.gz -C wyse .
          sha256sum LEITSTELLE112-Wyse-Vermittlung-${APP_VERSION}.tar.gz > SHA256SUMMEN_WYSE.txt
          cp LEITSTELLE112-Wyse-Vermittlung-${APP_VERSION}.tar.gz LEITSTELLE112-Server.tar.gz
          cp tools/wyse/server.sh server.sh
          gh release upload "v${APP_VERSION}" LEITSTELLE112-Wyse-Vermittlung-${APP_VERSION}.tar.gz LEITSTELLE112-Server.tar.gz server.sh SHA256SUMMEN_WYSE.txt --clobber

  windows:
    needs: [aufraeumen, tests]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Godot und Exportvorlagen laden
        shell: pwsh
        run: |
          $v = "$env:GODOT_VERSION"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$v-stable/Godot_v$v-stable_win64.exe.zip" -OutFile g.zip
          Expand-Archive g.zip -DestinationPath godot
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$v-stable/Godot_v$v-stable_export_templates.tpz" -OutFile t.zip
          Expand-Archive t.zip -DestinationPath tpl
          $dst = "$env:APPDATA\Godot\export_templates\$v.stable"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item tpl\templates\* $dst
      - name: Windows-Export
        shell: pwsh
        run: |
          $g = (Get-ChildItem godot\*_console.exe).FullName
          New-Item -ItemType Directory -Force build\windows\config, build\windows\config_standard\world | Out-Null
          & $g --headless --path . --import
          & $g --headless --path . --export-release "Windows Desktop" build\windows\LEITSTELLE112.exe
          Copy-Item data\*.json build\windows\config_standard\
          Copy-Item data\world\*.json build\windows\config_standard\world\
          Copy-Item packaging\config_README.txt build\windows\config\LIESMICH.txt
          Copy-Item packaging\LIESMICH.txt, packaging\LIZENZHINWEISE.txt build\windows\
          if (!(Test-Path build\windows\LEITSTELLE112.exe)) { throw "Export fehlgeschlagen" }
      - name: Versionsnummer ermitteln
        shell: pwsh
        run: |
          $v = (Select-String -Path project.godot -Pattern '^config/version="(.*)"').Matches[0].Groups[1].Value
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\LEITSTELLE112.iss
      - name: Beta-Version exportieren (getrennt, mit Zugangscode)
        shell: pwsh
        run: |
          $g = (Get-ChildItem godot\*_console.exe).FullName
          New-Item -ItemType Directory -Force build\windows_beta\config, build\windows_beta\config_standard\world | Out-Null
          & $g --headless --path . --export-release "Windows Beta" build\windows_beta\LEITSTELLE112_BETA.exe
          Copy-Item data\*.json build\windows_beta\config_standard\
          Copy-Item data\world\*.json build\windows_beta\config_standard\world\
          Copy-Item packaging\config_README.txt build\windows_beta\config\LIESMICH.txt
          Copy-Item packaging\LIESMICH_BETA.txt build\windows_beta\LIESMICH.txt
          Copy-Item packaging\LIZENZHINWEISE.txt build\windows_beta\
          if (!(Test-Path build\windows_beta\LEITSTELLE112_BETA.exe)) { throw "Beta-Export fehlgeschlagen" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\LEITSTELLE112_Beta.iss
      - name: Selbsttest der EXE unter Windows
        shell: pwsh
        run: |
          $log = Join-Path $PWD "selbsttest.log"
          $p = Start-Process build\windows\LEITSTELLE112.exe -ArgumentList "--headless","--selbsttest","--log-file","`"$log`"" -Wait -PassThru
          Write-Host "Exit-Code: $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log | Select-String "OK|FEHLER|SELBSTTEST|ERROR" }
          $ulog = Join-Path $env:APPDATA "LEITSTELLE112\logs\godot.log"
          if (Test-Path $ulog) { Get-Content $ulog -Tail 40 }
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen" }
      - name: Selbsttest der Beta-EXE
        shell: pwsh
        run: |
          $log = Join-Path $PWD "selbsttest_beta.log"
          $p = Start-Process build\windows_beta\LEITSTELLE112_BETA.exe -ArgumentList "--headless","--selbsttest","--log-file","`"$log`"" -Wait -PassThru
          Write-Host "Exit-Code: $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log | Select-String "OK|FEHLER|SELBSTTEST|ERROR" }
          if ($p.ExitCode -ne 0) { throw "Selbsttest der Beta fehlgeschlagen" }
      - name: Testversion bauen (nur Entwicklungszweige, eigener Ordner)
        # Wie die Beta (Zugangscode), aber eigener Installationsordner, eigene AppId und
        # eigene Spielstände (%APPDATA%\LEITSTELLE112_Test), damit eine installierte Beta
        # nicht überschrieben wird. Die Änderungen an project.godot/export_presets.cfg
        # gelten nur in diesem Build-Lauf.
        if: github.ref_name != github.event.repository.default_branch
        shell: pwsh
        run: |
          $g = (Get-ChildItem godot\*_console.exe).FullName
          (Get-Content project.godot -Raw -Encoding UTF8).Replace('custom_user_dir_name.beta="LEITSTELLE112_Beta"', 'custom_user_dir_name.beta="LEITSTELLE112_Test"') | Set-Content project.godot -Encoding UTF8 -NoNewline
          (Get-Content export_presets.cfg -Raw -Encoding UTF8).Replace('product_name="LEITSTELLE 112 BETA"', 'product_name="LEITSTELLE 112 TEST"') | Set-Content export_presets.cfg -Encoding UTF8 -NoNewline
          if (!(Select-String -Path project.godot -Pattern 'LEITSTELLE112_Test' -Quiet)) { throw "Datenordner der Testversion nicht gesetzt" }
          New-Item -ItemType Directory -Force build\windows_test\config, build\windows_test\config_standard\world | Out-Null
          & $g --headless --path . --export-release "Windows Beta" build\windows_test\LEITSTELLE112_TEST.exe
          Copy-Item data\*.json build\windows_test\config_standard\
          Copy-Item data\world\*.json build\windows_test\config_standard\world\
          Copy-Item packaging\config_README.txt build\windows_test\config\LIESMICH.txt
          Copy-Item packaging\LIESMICH_TEST.txt build\windows_test\LIESMICH.txt
          Copy-Item packaging\LIZENZHINWEISE.txt build\windows_test\
          if (!(Test-Path build\windows_test\LEITSTELLE112_TEST.exe)) { throw "Export der Testversion fehlgeschlagen" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DTest installer\LEITSTELLE112_Beta.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer der Testversion fehlgeschlagen" }
          git checkout -- project.godot export_presets.cfg
      - name: Selbsttest der Test-EXE
        if: github.ref_name != github.event.repository.default_branch
        shell: pwsh
        run: |
          $log = Join-Path $PWD "selbsttest_test.log"
          $p = Start-Process build\windows_test\LEITSTELLE112_TEST.exe -ArgumentList "--headless","--selbsttest","--log-file","`"$log`"" -Wait -PassThru
          Write-Host "Exit-Code: $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log | Select-String "OK|FEHLER|SELBSTTEST|ERROR|Datenordner" }
          if ($p.ExitCode -ne 0) { throw "Selbsttest der Testversion fehlgeschlagen" }
      - name: Release veröffentlichen (normale Version und getrennte Beta)
        # Nur der Hauptzweig (Standard-Branch) veröffentlicht die öffentliche Version.
        if: github.ref_name == github.event.repository.default_branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$APP_VERSION"
          mkdir -p out beta
          cp build/installer/LEITSTELLE112_Setup_${V}.exe out/
          7z a -tzip -bso0 out/LEITSTELLE112-Portable-${V}.zip ./build/windows/*
          (cd out && sha256sum * > SHA256SUMMEN.txt)
          awk -v v="## Version ${V} " 'index($0,v)==1{f=1;next} /^## Version /{f=0} f' CHANGELOG.md > notes.md
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" out/* --clobber
          else
            gh release create "v$V" out/* --target "$GITHUB_SHA" --title "LEITSTELLE 112 – Version ${V}" --notes-file notes.md
          fi
          cp build/installer_beta/LEITSTELLE112_BETA_Setup_${V}.exe beta/
          (cd beta && sha256sum *.exe > SHA256SUMMEN_BETA.txt)
          printf 'BETA-Version %s – nur für eingeladene Tester.\nStart nur mit persönlichem Zugangscode. Eigener Installationsordner und eigene Spielstände, getrennt von der normalen Version.\n' "$V" > beta_notes.md
          if gh release view "v$V-beta" >/dev/null 2>&1; then
            gh release upload "v$V-beta" beta/* --clobber
          else
            gh release create "v$V-beta" beta/* --target "$GITHUB_SHA" --prerelease --title "LEITSTELLE 112 BETA – ${V}" --notes-file beta_notes.md
          fi
      - name: Testversion veröffentlichen (Entwicklungszweig, nicht öffentlich)
        # Andere Zweige: nur die Testversion (Zugangscode wie Beta, eigener Installationsordner)
        # als Vorabversion »test-<zweig>«. Die öffentliche Version bleibt unberührt.
        if: github.ref_name != github.event.repository.default_branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$APP_VERSION"
          B="${GITHUB_REF_NAME//\//-}"
          TAG="test-${B}"
          mkdir -p testout
          cp build/installer_test/LEITSTELLE112_TEST_Setup_${V}.exe testout/LEITSTELLE112_TEST_${B}_${V}.exe
          printf 'TESTVERSION aus dem Entwicklungszweig %s (Version %s, Stand %s).\nNicht für die Öffentlichkeit. Startet nur mit Tester-Zugangscode. Eigener Installationsordner (LEITSTELLE 112 TEST) und eigene Spielstände – getrennt von normaler Version und Beta.\n' "$GITHUB_REF_NAME" "$V" "${GITHUB_SHA:0:7}" > test_notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" testout/* --clobber
            gh release edit "$TAG" --notes-file test_notes.md --target "$GITHUB_SHA"
          else
            gh release create "$TAG" testout/* --target "$GITHUB_SHA" --prerelease --title "TESTVERSION – ${GITHUB_REF_NAME}" --notes-file test_notes.md
          fi
