name: Build und Tests

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1

jobs:
  aufraeumen:
    # Alte Build-Zwischenstände löschen (die fertigen Dateien liegen dauerhaft in den Releases),
    # damit das Speicherkontingent für Artefakte nicht voll läuft.
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Alte Artefakte löschen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.workflow_run.id != '"${GITHUB_RUN_ID}"') | .id' | while read id; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" && echo "gelöscht: $id"
          done

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Godot laden
        run: |
          curl -sSL -o g.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q g.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot
      - name: Import
        run: ./godot --headless --path . --import || true
      - name: Kerntests
        run: ./godot --headless --path . res://tests/run_tests.tscn
      - name: Mehrspielertest (Host + 2 Clients)
        run: tools/test_multiplayer.sh ./godot
      - name: Mehrspielertest über Vermittlungsdienst
        run: tools/test_relay.sh ./godot

  wyse:
    needs: aufraeumen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Godot und Linux-Exportvorlagen laden
        run: |
          curl -sSL -o g.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q g.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot
          curl -sSL -o t.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q -j t.tpz templates/linux_release.x86_64 templates/linux_debug.x86_64 templates/version.txt -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Linux-Export für den Vermittlungsdienst
        run: |
          ./godot --headless --path . --import || true
          mkdir -p wyse
          ./godot --headless --path . --export-release "Linux" wyse/leitstelle112.x86_64
          cp tools/wyse/* docs/VERMITTLUNGSDIENST.md wyse/
          test -s wyse/leitstelle112.x86_64
          echo "APP_VERSION=$(grep -oP '^config/version="\K[^"]+' project.godot)" >> $GITHUB_ENV
      - name: Start des Vermittlungsdienstes prüfen
        run: |
          (timeout 8 wyse/leitstelle112.x86_64 --headless -- --vermittlung --port=24180 || true) | tee relay.log
          grep -q "Vermittlungsdienst LEITSTELLE 112 gestartet" relay.log
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: LEITSTELLE112-Wyse-Vermittlung-${{ env.APP_VERSION }}
          path: wyse/

  windows:
    needs: aufraeumen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Godot und Exportvorlagen laden
        shell: pwsh
        run: |
          $v = "$env:GODOT_VERSION"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$v-stable/Godot_v$v-stable_win64.exe.zip" -OutFile g.zip
          Expand-Archive g.zip -DestinationPath godot
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$v-stable/Godot_v$v-stable_export_templates.tpz" -OutFile t.zip
          Expand-Archive t.zip -DestinationPath tpl
          $dst = "$env:APPDATA\Godot\export_templates\$v.stable"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item tpl\templates\* $dst
      - name: Windows-Export
        shell: pwsh
        run: |
          $g = (Get-ChildItem godot\*_console.exe).FullName
          New-Item -ItemType Directory -Force build\windows\config, build\windows\config_standard\world | Out-Null
          & $g --headless --path . --import
          & $g --headless --path . --export-release "Windows Desktop" build\windows\LEITSTELLE112.exe
          Copy-Item data\*.json build\windows\config_standard\
          Copy-Item data\world\*.json build\windows\config_standard\world\
          Copy-Item packaging\config_README.txt build\windows\config\LIESMICH.txt
          Copy-Item packaging\LIESMICH.txt, packaging\LIZENZHINWEISE.txt build\windows\
          if (!(Test-Path build\windows\LEITSTELLE112.exe)) { throw "Export fehlgeschlagen" }
      - name: Versionsnummer ermitteln
        shell: pwsh
        run: |
          $v = (Select-String -Path project.godot -Pattern '^config/version="(.*)"').Matches[0].Groups[1].Value
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\LEITSTELLE112.iss
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: LEITSTELLE112-Windows-${{ env.APP_VERSION }}
          path: |
            build/windows/
            build/installer/*.exe
      - name: Beta-Version exportieren (getrennt, mit Zugangscode)
        shell: pwsh
        run: |
          $g = (Get-ChildItem godot\*_console.exe).FullName
          New-Item -ItemType Directory -Force build\windows_beta\config, build\windows_beta\config_standard\world | Out-Null
          & $g --headless --path . --export-release "Windows Beta" build\windows_beta\LEITSTELLE112_BETA.exe
          Copy-Item data\*.json build\windows_beta\config_standard\
          Copy-Item data\world\*.json build\windows_beta\config_standard\world\
          Copy-Item packaging\config_README.txt build\windows_beta\config\LIESMICH.txt
          Copy-Item packaging\LIESMICH_BETA.txt build\windows_beta\LIESMICH.txt
          Copy-Item packaging\LIZENZHINWEISE.txt build\windows_beta\
          if (!(Test-Path build\windows_beta\LEITSTELLE112_BETA.exe)) { throw "Beta-Export fehlgeschlagen" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\LEITSTELLE112_Beta.iss
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: LEITSTELLE112-BETA-Windows-${{ env.APP_VERSION }}
          path: build/installer_beta/*.exe
      - name: Selbsttest der EXE unter Windows
        shell: pwsh
        run: |
          $log = Join-Path $PWD "selbsttest.log"
          $p = Start-Process build\windows\LEITSTELLE112.exe -ArgumentList "--headless","--selbsttest","--log-file","`"$log`"" -Wait -PassThru
          Write-Host "Exit-Code: $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log | Select-String "OK|FEHLER|SELBSTTEST|ERROR" }
          $ulog = Join-Path $env:APPDATA "LEITSTELLE112\logs\godot.log"
          if (Test-Path $ulog) { Get-Content $ulog -Tail 40 }
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen" }
      - name: Selbsttest der Beta-EXE
        shell: pwsh
        run: |
          $log = Join-Path $PWD "selbsttest_beta.log"
          $p = Start-Process build\windows_beta\LEITSTELLE112_BETA.exe -ArgumentList "--headless","--selbsttest","--log-file","`"$log`"" -Wait -PassThru
          Write-Host "Exit-Code: $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log | Select-String "OK|FEHLER|SELBSTTEST|ERROR" }
          if ($p.ExitCode -ne 0) { throw "Selbsttest der Beta fehlgeschlagen" }

  release:
    # Veröffentlicht die geprüften Dateien als GitHub-Release:
    # direkter Download der Setup-EXE ohne Anmeldung und ohne ZIP.
    needs: [tests, windows, wyse]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Versionsnummer ermitteln
        run: echo "APP_VERSION=$(grep -oP '^config/version="\K[^"]+' project.godot)" >> $GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          name: LEITSTELLE112-Windows-${{ env.APP_VERSION }}
          path: win
      - uses: actions/download-artifact@v4
        with:
          name: LEITSTELLE112-Wyse-Vermittlung-${{ env.APP_VERSION }}
          path: wyse
      - name: Dateien zusammenstellen
        run: |
          mkdir -p out
          cp win/installer/LEITSTELLE112_Setup_${APP_VERSION}.exe out/
          (cd win/windows && zip -qr ../../out/LEITSTELLE112-Portable-${APP_VERSION}.zip .)
          chmod +x wyse/leitstelle112.x86_64 wyse/*.sh
          tar -czf out/LEITSTELLE112-Wyse-Vermittlung-${APP_VERSION}.tar.gz -C wyse .
          (cd out && sha256sum * > SHA256SUMMEN.txt)
          ls -la out
          awk -v v="## Version ${APP_VERSION} " 'index($0,v)==1{f=1;next} /^## Version /{f=0} f' CHANGELOG.md > notes.md
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "LEITSTELLE 112 – Version ${APP_VERSION}" --notes-file notes.md
          fi
      - uses: actions/download-artifact@v4
        with:
          name: LEITSTELLE112-BETA-Windows-${{ env.APP_VERSION }}
          path: beta
      - name: Beta getrennt als Vorabversion veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}-beta"
          (cd beta && sha256sum *.exe > SHA256SUMMEN_BETA.txt)
          printf 'BETA-Version %s – nur für eingeladene Tester.\nStart nur mit persönlichem Zugangscode. Eigener Installationsordner und eigene Spielstände, getrennt von der normalen Version.\n' "$APP_VERSION" > beta_notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" beta/* --clobber
          else
            gh release create "$TAG" beta/* --target "$GITHUB_SHA" --prerelease --title "LEITSTELLE 112 BETA – ${APP_VERSION}" --notes-file beta_notes.md
          fi
